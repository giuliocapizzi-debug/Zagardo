<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Zagardo</title>
<style>
:root{--bg:#0e1020;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--fg:#fff}}
:root[data-theme="dark"]{--bg:#0e1020;--fg:#fff}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var c=document.getElementById('c'),ctx=c.getContext('2d');
var W,H,rh,lw,dpr,rows,score,combo,idx,state,miss,overAt,best=0,t0=0,AC=null;
try{if(!localStorage.getItem('zagardo-v2')){localStorage.removeItem('zagardo-best');localStorage.setItem('zagardo-v2','1')}best=+localStorage.getItem('zagardo-best')||0}catch(e){}
// melodia originale (semitoni su scala pentatonica)
// m = coppie [nota in semitoni, durata in battiti]; bpm = tempo
var SONGS=[{n:'Zagardo (originale)',bpm:120,d:[21,43,66,91],m:[0,.5,4,.5,7,.5,12,.5,9,1,7,1, 4,.5,7,.5,9,.5,7,.5,4,1,2,1, 0,.5,4,.5,7,.5,12,.5,16,1,14,1, 12,1,9,.5,7,.5,9,2, 5,.5,9,.5,12,.5,9,.5,7,1,4,1, 2,.5,5,.5,9,.5,5,.5,4,.5,2,.5,0,1, 4,.5,7,.5,11,.5,14,.5,12,1,7,1, 9,1,7,1,4,2, 7,.5,12,.5,16,.5,12,.5,19,1,16,1, 14,.5,12,.5,9,.5,12,.5,14,1,9,1, 5,.5,9,.5,12,.5,16,.5,14,.5,12,.5,9,1, 7,1,9,.5,7,.5,4,2, 0,.5,4,.5,7,.5,4,.5,0,.5,4,.5,7,1, 2,.5,5,.5,9,.5,5,.5,2,.5,5,.5,9,1, 4,.5,7,.5,12,.5,7,.5,16,1,12,1, 12,.5,9,.5,7,.5,4,.5,0,2]},{n:'Ode alla gioia',bpm:108,m:[4,1,4,1,5,1,7,1, 7,1,5,1,4,1,2,1, 0,1,0,1,2,1,4,1, 4,1.5,2,.5,2,2, 4,1,4,1,5,1,7,1, 7,1,5,1,4,1,2,1, 0,1,0,1,2,1,4,1, 2,1.5,0,.5,0,2, 2,1,2,1,4,1,0,1, 2,1,4,.5,5,.5,4,1,0,1, 2,1,4,.5,5,.5,4,1,2,1, 0,1,2,1,-5,2, 4,1,4,1,5,1,7,1, 7,1,5,1,4,1,2,1, 0,1,0,1,2,1,4,1, 2,1.5,0,.5,0,2]},{n:'Pioggia di stelle',bpm:128,inst:'piano',d:[22,46,63,86,133],m:[9,.5,12,.5,16,.5,12,.5,14,1,12,1, 11,.5,14,.5,17,.5,14,.5,16,1,11,1, 9,.5,12,.5,16,.5,21,.5,19,.5,16,.5,12,.5,9,.5, 11,1,9,1,4,2, 7,1,7,.5,9,.5,11,1,9,.5,7,.5, 5,1,5,.5,7,.5,9,1,7,.5,5,.5, 4,.5,5,.5,7,.5,9,.5,11,.5,12,.5,14,.5,16,.5, 17,1,16,.5,14,.5,12,2, 4,1.5,7,.5,9,1.5,7,.5, 5,1.5,9,.5,12,1.5,9,.5, 7,1.5,11,.5,14,1.5,11,.5, 12,.5,11,.5,9,.5,7,.5,4,2, 16,.5,16,.5,19,.5,16,.5,21,1,19,1, 14,.5,14,.5,17,.5,14,.5,19,1,17,1, 12,.5,16,.5,19,.5,16,.5,21,.5,19,.5,16,.5,12,.5, 14,1,11,1,9,2, 9,.5,12,.5,16,.5,12,.5,14,1,12,1, 11,.5,14,.5,17,.5,14,.5,19,1,16,1, 9,.5,12,.5,16,.5,21,.5,19,1,16,1, 14,.5,12,.5,11,.5,9,.5,7,1,4,1, 9,.5,9,.5,12,.5,9,.5,16,1,12,1, 11,.5,11,.5,14,.5,11,.5,17,1,14,1, 16,.5,14,.5,12,.5,11,.5,9,.5,7,.5,5,.5,4,.5, 4,1,7,1,9,2]}];
var sel=0,SG=SONGS[0],BP=SONGS[0].bpm,ll=-1,lrun=0,won=false,pv={i:0,t:0,b:0};
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(semi,dur,type,vol){
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.value=261.63*Math.pow(2,semi/12);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.05);
}
function noteOn(n,d,i){var l=Math.min(1.6,d*60/BP)+0.2;if(SG.inst==='piano'){piano(n,l);return}
  
  tone(n,l,'triangle',0.35);
  tone(n+12,l*0.5,'sine',0.08);
  if(i%4===0)tone(n-12,l,'sine',0.22);
}
function fail(){tone(-24,0.5,'sawtooth',0.2);tone(-27,0.6,'sawtooth',0.2)}
var ni=0;
function addRow(bottom){var k=(ni%(SG.m.length/2))*2,b=SG.m[k+1],h=b*rh;var pl=ll,pr=lrun,qi=ni%(SG.m.length/2);ni++;var ln=Math.floor(Math.random()*4);if(ln===ll&&lrun>=2)ln=(ln+1+Math.floor(Math.random()*3))%4;lrun=ln===ll?lrun+1:1;ll=ln;rows.push({y:bottom-h,h:h,lane:ln,hit:false,a:0,n:SG.m[k],b:b,g:ni});if(SG.d&&SG.d.indexOf(qi)>=0){var l2;do{l2=Math.floor(Math.random()*4)}while(l2===ln||(l2===pl&&pr>=2));rows.push({y:bottom-h,h:h,lane:l2,hit:false,a:0,n:SG.m[k]+7,b:b,g:ni})}}
function reset(){
  rows=[];score=0;combo=0;idx=0;state='ready';miss=null;
  pv.i=0;pv.t=0;pv.b=0;ni=0;ll=-1;lrun=0;addRow(-rh);
  while(ni<NN()&&rows[rows.length-1].y>-rh)addRow(rows[rows.length-1].y);
}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=c.clientWidth;H=c.clientHeight;
  c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  lw=W/4;rh=H/4.2;
  if(state==='ready'||!rows)reset();
}
function hx(r,x){var x0=r.lane*lw;return x<x0?x0-x:x>x0+lw?x-x0-lw:0}
function first(x,y){var a=null,best=null,bd=1e9;for(var i=0;i<rows.length;i++){var r=rows[i];if(r.hit)continue;if(!a)a=r;if(r.g!==a.g)break;if(x!==undefined){var d=hx(r,x);if(d<bd){bd=d;best=r}}}return x!==undefined&&best&&bd<=lw*0.3?best:a}
function ZT(){return H-rh*1.2}
function tap(x,y){
  audio();
  if(state==='ready'&&y>H*0.14+124&&y<H*0.14+168){var dx=x-W/2;if(Math.abs(dx)>40&&Math.abs(dx)<130){BP=Math.max(60,Math.min(240,BP+(dx<0?-4:4)));}return}
  if(state==='ready'&&y>H*0.14+72&&y<H*0.14+118){sel=(sel+1)%SONGS.length;SG=SONGS[sel];BP=SG.bpm;reset();return}
  if(state==='over'){if(performance.now()-overAt>300){var m=y>H*0.68&&y<H*0.68+44&&Math.abs(x-W/2)<110;reset();if(!m)state='play'}return}
  var lane=Math.min(3,Math.max(0,Math.floor(x/lw))),f=first(x,y);
  if(state==='ready'){state='play';return}
  if(state==='ready'&&state!=='play')return;
  if(f&&hx(f,x)<=lw*0.3&&y>=f.y&&y<f.y+f.h&&y>=ZT()){
    f.hit=true;f.a=1;score+=MU();combo++;noteOn(f.n,f.b,idx++);
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  }else{
    var ok=false;for(var j=0;j<rows.length;j++){var q=rows[j];if(!q.hit&&y<ZT()&&lane===q.lane&&y>=q.y&&y<q.y+q.h)return}
    for(var i=0;i<rows.length;i++){var r=rows[i];if(r.hit&&hx(r,x)<=lw*0.3&&y>=r.y&&y<r.y+r.h)ok=true}
    if(!ok)gameOver(x,y);
  }
}
function gameOver(x,y){
  state='over';won=false;score=Math.round(score);overAt=performance.now();miss={x:x,y:y};fail();
  if(score>best){best=score;try{localStorage.setItem('zagardo-best',best)}catch(e){}}
}
function piano(n,l){if(!AC)return;var t=AC.currentTime,f=261.63*Math.pow(2,n/12),e=Math.max(l,0.9),g=AC.createGain();g.connect(AC.destination);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.32,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+e);[[1,1],[2,0.45],[3,0.22],[4,0.1],[5,0.05]].forEach(function(p){var o=AC.createOscillator(),q=AC.createGain();o.type='sine';o.frequency.value=f*p[0];q.gain.value=p[1];o.connect(q);q.connect(g);o.start(t);o.stop(t+e+0.05)})}
function NN(){return SG.m.length/2}
function MU(){return BP>120?BP/120:1}
function muTxt(){return BP>120?'Punti ×'+(+MU().toFixed(2)):BP===120?'Punti ×1':'Punti ×1 (senza onore né credibilità)'}
function win(){state='over';won=true;score=Math.round(score);overAt=performance.now();miss=null;tone(0,0.9,'triangle',0.3);tone(4,0.9,'triangle',0.25);tone(7,0.9,'triangle',0.25);tone(12,1.2,'triangle',0.25);if(score>best){best=score;try{localStorage.setItem('zagardo-best',best)}catch(e){}}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,al){ctx.font='700 '+size+'px system-ui,-apple-system,sans-serif';ctx.textAlign=al||'center';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function frame(t){
  var dt=Math.min(0.05,(t-t0)/1000||0);t0=t;
  if(state==='ready'&&AC&&AC.state==='running'&&t>=pv.t){if(pv.b>=32){pv.i=0;pv.b=0;pv.t=t+120000/BP}else{var pk=(pv.i%NN())*2,pn=SG.m[pk+1];noteOn(SG.m[pk],pn,pv.i);pv.i++;pv.b+=pn;pv.t=t+pn*60000/BP}}
  if(state==='play'){
    var sp=rh*BP/60;
    rows.forEach(function(r){r.y+=sp*dt});
    while(rows.length&&rows[0].hit&&rows[0].y>H)rows.shift();
    while(ni<NN()&&rows[rows.length-1].y>-rh)addRow(rows[rows.length-1].y);
    var f=first();
    if(f&&f.y>H){gameOver(f.lane*lw+lw/2,H-10)}else if(!f&&ni>=NN())win();
  }
  // sfondo
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1f4a');g.addColorStop(1,'#0e1020');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,209,102,.10)';ctx.fillRect(0,ZT(),W,H-ZT());ctx.fillStyle='rgba(255,209,102,.7)';ctx.fillRect(0,ZT(),W,2);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;
  for(var i=1;i<4;i++){ctx.beginPath();ctx.moveTo(i*lw,0);ctx.lineTo(i*lw,H);ctx.stroke()}
  rows.forEach(function(r){
    var x=r.lane*lw+2,y=r.y+2,w=lw-4,h=r.h-4;
    if(r.hit){
      r.a=Math.max(0,r.a-dt*1.5);
      ctx.fillStyle='hsla('+((idx*14)%360)+',90%,60%,'+(0.15+r.a*0.5)+')';
      rr(x,y,w,h,10);ctx.fill();
    }else{
      ctx.fillStyle='#05060f';rr(x,y,w,h,10);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.25)';ctx.stroke();
    }
  });
  if(state==='ready'){
    var f0=first();
    
    txt('ZAGARDO',W/2,H*0.14,Math.min(54,W*0.13),'#ffd166');
    txt('Tocca lo schermo per iniziare',W/2,H*0.14+34,16,'rgba(255,255,255,.75)');
    if(best)txt('Record: '+best,W/2,H*0.14+60,16,'rgba(255,255,255,.75)');
    ctx.fillStyle='rgba(255,255,255,.12)';rr(W/2-130,H*0.14+76,260,38,19);ctx.fill();
    txt('♪ '+SONGS[sel].n+' ›',W/2,H*0.14+101,16,'#fff');
    ctx.fillStyle='rgba(255,255,255,.12)';rr(W/2-130,H*0.14+126,260,38,19);ctx.fill();
    txt('−',W/2-100,H*0.14+154,26,'#fff');txt('BPM '+BP,W/2,H*0.14+151,16,'#fff');txt('+',W/2+100,H*0.14+154,26,'#fff');
    txt(muTxt(),W/2,H*0.14+190,14,'rgba(255,255,255,.7)');
  }
  if(state==='play'){
    txt(String(Math.round(score)),W/2,H*0.12,Math.min(64,W*0.15),'#fff');
    if(combo>2)txt('Combo ×'+combo,W/2,H*0.12+30,18,'#ffd166');
    txt(muTxt(),W/2,H*0.12+54,13,'rgba(255,255,255,.6)');
  }
  if(state==='over'){
    if(miss){ctx.fillStyle='rgba(255,60,80,.55)';ctx.beginPath();ctx.arc(miss.x,miss.y,lw*0.5,0,7);ctx.fill()}
    ctx.fillStyle='rgba(8,9,20,.78)';ctx.fillRect(0,0,W,H);
    txt(won?'Canzone completata!':'Game over',W/2,H*0.3,Math.min(won?34:44,W*(won?0.085:0.11)),won?'#06d6a0':'#ff6b81');
    txt(String(score),W/2,H*0.42,Math.min(86,W*0.22),'#fff');
    txt('Record: '+best,W/2,H*0.49,20,'#ffd166');
    txt('Tocca per riprovare',W/2,H*0.6,20,'rgba(255,255,255,.85)');
    ctx.fillStyle='rgba(255,255,255,.15)';rr(W/2-110,H*0.68,220,44,22);ctx.fill();txt('Cambia canzone / BPM',W/2,H*0.68+28,15,'#fff');
  }
  requestAnimationFrame(frame);
}
c.addEventListener('pointerdown',function(e){e.preventDefault();var b=c.getBoundingClientRect();tap(e.clientX-b.left,e.clientY-b.top)});
window.addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
